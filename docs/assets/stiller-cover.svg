  <text x="65" y="82" fill="#d6c49e" font-family="sans-serif" font-size="14" letter-spacing="5">MEMORY · EXPERIENCE · CONTINUITY</text>
  <text x="61" y="157" fill="#f5f0e5" font-family="Georgia,serif" font-size="62">Stiller Brain</text>
  <text x="65" y="218" fill="#d7d6e2" font-family="Microsoft YaHei,sans-serif" font-size="23">让共同经历留下来，让后来的交流有来处。</text>
